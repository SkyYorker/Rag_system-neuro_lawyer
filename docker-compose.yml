version: '3.8'

services:
  ai-legal-advisor:
    build: .
    ports:
      - "8501:8501"  # Streamlit web interface
      - "8000:8000"  # FastAPI (если будет добавлено)
    environment:
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
      - CHROMA_PERSIST_DIRECTORY=/app/data/chroma_db
      - REDIS_HOST=redis
      - ENVIRONMENT=production
      - DEBUG=false
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Опционально: Phoenix для трассировки
  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
    environment:
      - PHOENIX_SQL_DATABASE_URL=sqlite:///tmp/phoenix.db
    volumes:
      - phoenix_data:/tmp
    restart: unless-stopped
    profiles: ["monitoring"]

volumes:
  redis_data:
  phoenix_data:

networks:
  default:
    name: ai-legal-advisor-network